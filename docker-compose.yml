services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: redactor-backend
    ports:
      - "8000:8000"
    environment:
      - REDACTOR_CORS_ORIGINS=*
      - REDACTOR_MAX_WORKERS=2
      - REDACTOR_ENABLE_ML=false
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: redactor-frontend
    ports:
      - "3000:3000"
    environment:
      - REDACTOR_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
